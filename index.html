<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="circles">
            <div class="cricle"></div>
            <div class="cricle"></div>
        </div>
 
        <div class="title">AGE</div>
 
        <div class="todayAge">
            <h1>TODAY'S DATE</h1>
            <span id="TDate" class="date"></span>
        </div>
 
        <div class="YBirthDay">
            <h1>YOUR BIRTHDAY</h1>
            <input type="date" name="" id="dateBirth">
        </div>
 
        <div class="results">
            <div class="result">
                <div class="resultCircle"><span id="rYears">00</span></div>
                <p>Year</p>
            </div>
            <div class="result">
                <div class="resultCircle"><span id="rMonths">00</span></div>
                <p>Months</p>
            </div>
            <div class="result">
                <div class="resultCircle"><span id="rDays">00</span></div>
                <p>Days</p>
            </div>
        </div>
 
        <button id="refreshBtn" aria-label="Reset">&#8635;</button>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
